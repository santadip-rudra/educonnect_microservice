spring:
  application:
    name: assessment-service

  datasource:
    url: jdbc:mysql://localhost:3306/assessment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 2479308
    driver-class-name: com.mysql.cj.jdbc.Driver

  config:
    import: optional:classpath:application-secret.properties

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
    formcontent:
      filter:
        enabled: false

server:
  port: 8085

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: Z3Vlc3N3aGF0Z2VtaW5paXN3YXRjaGluZ3lvdXJlY29kZXZlcnlkYXkyMDI2
  expiration: 600000

gateway:
  base-url: http://localhost:8081